<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Chess - Master Chess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/chessboard.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gray-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">
                <img src="assets/images/logo.png" alt="Master Chess Logo" class="inline h-8 w-8 mr-2">Master Chess
            </a>
            <div class="space-x-4">
                <a href="index.html" class="hover:text-gray-300">Home</a>
                <a href="game.html" class="hover:text-gray-300">Play Game</a>
                <a href="about.html" class="hover:text-gray-300">About</a>
            </div>
        </div>
    </nav>

    <!-- Main Game Area -->
    <main class="flex-grow container mx-auto p-4 flex flex-col md:flex-row gap-4">
        <!-- Chessboard Area -->
        <div id="board" class="w-full md:w-2/3 lg:w-1/2 max-w-[500px] mx-auto md:mx-0 shadow-lg">
            <!-- Chessboard will be initialized here by chessboard.js -->
        </div>

        <!-- Game Info and Controls Area -->
        <div class="w-full md:w-1/3 lg:w-1/2 flex flex-col gap-4 p-4 bg-white rounded shadow-lg">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Game Status</h2>
            <div class="grid grid-cols-2 gap-2 text-lg mb-4">
                <div>Level: <span id="levelDisplay" class="font-bold">1/12</span></div>
                <div>Score: <span id="scoreDisplay" class="font-bold">0</span></div>
            </div>
            <div id="statusDisplay" class="mb-4 p-3 bg-gray-200 rounded text-gray-700 text-center">White to move.</div>

            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Controls</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <button id="newGameBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-300">New Game</button>
                <button id="undoMoveBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition duration-300">Undo Move</button>
            </div>

            <h2 class="text-xl font-semibold mb-2 text-gray-700">Move History</h2>
            <div id="moveHistory" class="h-48 overflow-y-auto border p-2 bg-gray-50 rounded custom-scrollbar">
                <!-- Moves will be listed here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 text-center">
        <div class="container mx-auto">
            <p class="mb-2">&copy; 2025 Master Chess. All rights reserved.</p>
            <p class="text-sm mb-2">Powered by chess.js and chessboard.js</p>
            <a href="about.html" class="text-gray-400 hover:text-gray-300 text-sm">About Us</a>
        </div>
    </footer>

    <!-- Hidden audio elements for sound effects -->
    <audio id="moveSound" src="assets/sounds/move.wav" preload="auto"></audio>
    <audio id="captureSound" src="assets/sounds/capture.wav" preload="auto"></audio>

    <script src="js/chess.js"></script>
    <script src="js/chessboard.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
