{% if user.is_authenticated %}
    <p>Welcome, {{ user.username }}! You are logged in as a {{ user.role }}.</p>
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
{% else %}
    <p>You are not logged in.</p>
    <a href="{% url 'login' %}">Login</a>
{% endif %}
